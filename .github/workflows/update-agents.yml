# Workflow to check AGENTS.md directory structure
# Runs daily and creates an issue if changes are detected

name: Update AGENTS.md

on:
  pull_request:
    branches: [ master, main ]
    paths:
      - 'AGENTS.md'
      - '.agents/**'
      - '.github/agents/**'
      - '.github/instructions/**'
      - '.github/scripts/update_agents_structure.py'
      - '.github/workflows/update-agents.yml'
      - 'tools/**'
      - 'ddns/**'
      - 'schema/**'
      - 'docs/**'
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allow manual triggering

permissions:
  contents: read

# Prevent concurrent runs
concurrency:
  group: update-agents-md
  cancel-in-progress: true

jobs:
  contracts:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      
      - name: Run portable agent structure contract
        run: python3 .github/scripts/update_agents_structure.py --check

      - name: Run provider parity contract
        run: python3 tools/check.py --providers

  report-structure-drift:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run portable agent structure contract
        run: python3 .github/scripts/update_agents_structure.py

      - name: Run provider parity contract
        run: python3 tools/check.py --providers

      - name: Check for existing issue
        if: hashFiles('.github/issue_body.md') != ''
        id: existing
        run: |
          existing_issue=$(gh issue list --label "agents-structure-update" --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$existing_issue" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "issue_number=$existing_issue" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create issue
        if: hashFiles('.github/issue_body.md') != '' && steps.existing.outputs.exists == 'false'
        run: |
          gh issue create \
            --title "docs(agents): AGENTS.md directory structure needs update" \
            --body-file .github/issue_body.md \
            --label "documentation,automated,agents-structure-update"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
