name: Copilot built-in token probe

on:
  push:
    branches: [newfuture-agentic-workflow-research]
    paths: [.github/workflows/copilot-token-probe.yml]

permissions: {}

jobs:
  inference:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      copilot-requests: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Install pinned Copilot CLI
        run: npm install --global --no-audit --no-fund @github/copilot@1.0.83

      - name: Request one response using the built-in Actions token
        timeout-minutes: 2
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response="$(copilot -p 'Reply with exactly COPILOT_TOKEN_OK. Do not use any tools.' -s --no-ask-user --disable-builtin-mcps)"
          if [ "$response" != "COPILOT_TOKEN_OK" ]; then
            echo "Copilot returned a response, but it did not match the probe marker."
            exit 1
          fi
          echo "Copilot inference succeeded using the built-in Actions token."
