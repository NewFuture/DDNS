name: Publish Rust
run-name: Release Rust ${{ github.ref_name }}

on:
  push:
    tags: [v*]

permissions:
  contents: read

jobs:
  binary:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: ddns-rs-linux-x64
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            asset: ddns-rs-linux-arm64
            target: aarch64-unknown-linux-musl
          - os: windows-latest
            asset: ddns-rs-windows-x64.exe
            target: x86_64-pc-windows-msvc
          - os: macos-15-intel
            asset: ddns-rs-macos-x64
            target: x86_64-apple-darwin
          - os: macos-latest
            asset: ddns-rs-macos-arm64
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo test --manifest-path rust/Cargo.toml --locked
      - name: Install musl toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build static Linux binary
        if: runner.os == 'Linux'
        run: cargo build --manifest-path rust/Cargo.toml --release --locked --target ${{ matrix.target }}
        env:
          CC: musl-gcc
      - name: Build native binary
        if: runner.os != 'Linux'
        run: cargo build --manifest-path rust/Cargo.toml --release --locked --target ${{ matrix.target }}
      - name: Smoke test Rust binary
        if: runner.os != 'Windows'
        run: |
          binary="rust/target/${{ matrix.target }}/release/ddns-rs"
          "$binary" --version
          "$binary" --help
          "$binary" --dns debug --no-cache --index4 "shell:echo 192.0.2.44" --ipv4 test.example.com
      - name: Smoke test Rust Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = "rust\target\${{ matrix.target }}\release\ddns-rs.exe"
          & $binary --version
          & $binary --help
          & $binary --dns debug --no-cache --index4 "shell:echo 192.0.2.44" --ipv4 test.example.com
      - name: Package Unix artifact and checksum
        if: runner.os != 'Windows'
        run: |
          cp "rust/target/${{ matrix.target }}/release/ddns-rs" "${{ matrix.asset }}"
          shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
      - name: Package Windows artifact and checksum
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item 'rust\target\${{ matrix.target }}\release\ddns-rs.exe' '${{ matrix.asset }}'
          $hash = (Get-FileHash -Algorithm SHA256 '${{ matrix.asset }}').Hash.ToLowerInvariant()
          Set-Content -NoNewline -Path '${{ matrix.asset }}.sha256' -Value "$hash  ${{ matrix.asset }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
          if-no-files-found: error

  release-assets:
    needs: binary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: publish
      url: https://github.com/NewFuture/DDNS/releases/tag/${{ github.ref_name }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: ddns-rs-*
          path: dist
          merge-multiple: true
      - name: Verify complete Rust artifact set
        run: |
          set -eu
          for asset in \
            ddns-rs-linux-x64 \
            ddns-rs-linux-arm64 \
            ddns-rs-windows-x64.exe \
            ddns-rs-macos-x64 \
            ddns-rs-macos-arm64; do
            test -f "dist/$asset"
            test -f "dist/$asset.sha256"
          done
      - name: Upload complete Rust release assets
        run: gh release upload "${{ github.ref_name }}" dist/ddns-rs-* --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  container:
    needs: release-assets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: publish
      url: https://github.com/NewFuture/DDNS/pkgs/container/ddns-rs
    permissions:
      packages: write
      id-token: write
      attestations: write
    env:
      platforms: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: ${{ env.platforms }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/newfuture/ddns-rs
          flavor: |
            latest=${{ !(contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'c')) }}
          tags: |
            type=ref,event=tag
            type=raw,value=next,enable=${{ !contains(github.ref_name, 'alpha') }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/rust.Dockerfile
          platforms: ${{ env.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
